services:
  - type: web
    name: shopify-admin-mcp
    runtime: node
    plan: free               # free tier: sleeps after ~15 min of inactivity; first call after sleep is slow
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SHOPIFY_SHOP
        sync: false          # e.g. athq.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false          # optional: use instead of client id/secret if you have a shpat_ token
      - key: SHOPIFY_API_VERSION
        value: 2026-10
      - key: MCP_AUTH_TOKEN
        generateValue: true  # Render creates a random secret; copy it from the dashboard
      - key: READ_ONLY
        value: "false"
